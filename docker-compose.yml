services:
  postgres:
    image: postgres:17-alpine
    # Logical decoding, for the M4 change feed and cmd/feedbench; slots and
    # senders for feedbench -nodes 10 plus the tests' own.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=20", "-c", "max_wal_senders=20"]
    environment:
      POSTGRES_USER: comet
      POSTGRES_PASSWORD: comet
      POSTGRES_DB: comet
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Transaction-mode pooler for make test-pgbouncer: Config.DB through it,
  # the logical feed's replication connection direct.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    depends_on: [postgres]
    ports:
      - "54330:5432"
    volumes:
      - ./docker/pgbouncer:/etc/pgbouncer:ro

  # Consistent-hash routing on the client's route parameter, for make
  # test-routing: two nodes on the host, behind this. A profile, so a plain
  # `docker compose up -d` (make db) does not start it.
  nginx:
    image: nginx:1.27-alpine
    profiles: [routing]
    ports:
      - "54331:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
