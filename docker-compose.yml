services:
  postgres:
    image: postgres:17-alpine
    # Logical decoding, for the M4 change feed and cmd/feedbench.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: comet
      POSTGRES_PASSWORD: comet
      POSTGRES_DB: comet
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
