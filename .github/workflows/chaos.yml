name: chaos

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chaos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor go.mod declares (pgx v5.11 needs 1.25), and the newest release.
        go: [floor, stable]
    name: chaos (go ${{ matrix.go }})
    env:
      # Never switch to a newer toolchain behind our back: the floor job must build with the floor.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.go == 'floor' && 'go.mod' || '' }}
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
      - name: Vet
        run: go vet ./...
      # A plain container rather than a service, so the tests can restart it.
      - name: Start Postgres
        run: |
          docker run -d --name cometgo-pg -p 54329:5432 \
            -e POSTGRES_USER=comet -e POSTGRES_PASSWORD=comet -e POSTGRES_DB=comet \
            postgres:17-alpine
          for i in $(seq 60); do
            docker exec cometgo-pg pg_isready -U comet -d comet -h 127.0.0.1 && exit 0
            sleep 1
          done
          docker logs cometgo-pg
          exit 1
      - name: Fault-injection tests
        env:
          COMETGO_TEST_DATABASE_URL: postgres://comet:comet@localhost:54329/comet
          COMETGO_TEST_PG_RESTART: docker restart cometgo-pg
        run: go test -race -count=3 -run TestChaos .
