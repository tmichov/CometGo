name: logical

on:
  push:
    branches: [main]
  pull_request:

jobs:
  logical:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The logical feed needs PG 14; column lists (InstallPublicationKeysOnly)
        # and pg_publication_tables.attnames arrive in 15, inactive_since in 17.
        postgres: [14, 15, 17]
    name: logical feed (postgres ${{ matrix.postgres }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start Postgres
        run: |
          docker run -d --name cometgo-pg -p 54329:5432 \
            -e POSTGRES_USER=comet -e POSTGRES_PASSWORD=comet -e POSTGRES_DB=comet \
            postgres:${{ matrix.postgres }}-alpine -c wal_level=logical
          for i in $(seq 60); do
            docker exec cometgo-pg pg_isready -U comet -d comet -h 127.0.0.1 && exit 0
            sleep 1
          done
          docker logs cometgo-pg
          exit 1
      # The whole suite on the logical feed, the publication checks included.
      - name: Tests on the logical feed
        env:
          COMETGO_TEST_DATABASE_URL: postgres://comet:comet@localhost:54329/comet
          COMETGO_TEST_FEED: logical
        run: go test -count=1 .
