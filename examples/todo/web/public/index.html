<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CometGo Todos</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --fg: #1d2330; --muted: #6b7385; --line: #e3e6ec; --accent: #5b5bd6; --ok: #2f9e6b; --warn: #c27a12; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12141a; --card: #1b1e26; --fg: #e6e8ee; --muted: #8b93a6; --line: #2a2e39; --accent: #8b8bf0; --ok: #4cc38a; --warn: #e3a547; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
    h1 { font-size: 22px; margin: 0; }
    .pill { font-size: 12px; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
    .pill.connected { color: var(--ok); border-color: var(--ok); }
    .pill.connecting, .pill.disconnected { color: var(--warn); border-color: var(--warn); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    form { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
    input[type=text] { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
    button { padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    button.link { background: none; color: var(--muted); padding: 4px 8px; }
    button.link:hover { color: var(--fg); }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    li:last-child { border-bottom: 0; }
    li.done .title { color: var(--muted); text-decoration: line-through; }
    .title { flex: 1; overflow-wrap: anywhere; }
    .empty { padding: 24px; text-align: center; color: var(--muted); }
    footer { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    .stale { opacity: .55; transition: opacity .2s; }
    .error { color: var(--warn); font-size: 13px; padding: 0 12px 8px; }
    p.hint { color: var(--muted); font-size: 13px; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Todos</h1>
      <span id="status" class="pill">connecting</span>
    </header>
    <div class="card">
      <form id="add">
        <input id="title" type="text" placeholder="What needs doing?" autocomplete="off">
        <button type="submit">Add</button>
      </form>
      <div id="error" class="error" hidden></div>
      <ul id="list"></ul>
      <footer>
        <span id="count"></span>
        <span id="timing"></span>
        <button id="clear" class="link" type="button">Clear done</button>
      </footer>
    </div>
    <p class="hint">Open this page in a second tab: changes appear everywhere. When a call resolves, its result is already on screen.</p>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
