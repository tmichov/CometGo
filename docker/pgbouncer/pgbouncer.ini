; PgBouncer in transaction mode in front of the test database, for running
; the suite with Config.DB through a pooler (make test-pgbouncer). The
; logical feed's ReplicationDSN goes to Postgres directly.
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; pgx prepares its statements; PgBouncer 1.21+ tracks them across server
; connections in transaction mode.
max_prepared_statements = 200
max_client_conn = 2000
default_pool_size = 60
ignore_startup_parameters = extra_float_digits
