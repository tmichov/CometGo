# make test-routing: the docs/server.md "Routing to nodes" recipe in front of
# two CometGo nodes that the Go test runs on the host (routing_test.go).
events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream comet {
        hash $arg_route consistent;
        # max_fails=0: a node is never marked down, so every connection tries
        # its key's own node first and moves on only after that one fails.
        server host.docker.internal:54341 max_fails=0;
        server host.docker.internal:54342 max_fails=0;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://comet;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 1h;
            proxy_next_upstream error timeout http_503;
        }
    }
}
